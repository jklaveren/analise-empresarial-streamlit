name: Campanhas — avanca a fila de envio

# O envio imita operacao humana em vez de disparar tudo de uma vez: poucos
# e-mails por rodada, de segunda a sexta, em horario comercial. Quem decide
# se a rodada vale e' o BACKEND (ENVIO_POR_RODADA, ENVIO_JANELA_*,
# ENVIO_DIAS_SEMANA) -- este cron so' bate na porta. Rodada fora da janela
# responde processadas=0 e nao manda nada, entao errar o fuso aqui nao
# dispara e-mail na hora errada.
#
# O cron do GitHub Actions nao e' pontual: sob carga atrasa 5-15 min. Como o
# ritmo real e' decidido no backend, o atraso so' rende menos rodadas no
# dia, nunca rajada.
#
# Requer o secret CAMPANHAS_CRON_SECRET (Settings > Secrets > Actions) com o
# MESMO valor da variavel CRON_SECRET configurada no Render. Sem isso, o
# endpoint recusa a chamada (403) e nada e' enviado.

on:
  schedule:
    # A cada 10 min, 10:00-22:50 UTC = 07:00-19:50 em Brasilia (UTC-3),
    # de segunda a sexta. A janela fina (ate 19:30) e' aplicada no backend.
    - cron: "*/10 10-22 * * 1-5"
  workflow_dispatch:

# Uma rodada por vez: se a anterior ainda estiver rodando, esta espera em
# vez de mandar em paralelo (o que dobraria o ritmo sem querer).
concurrency:
  group: campanhas-fila
  cancel-in-progress: false

jobs:
  proxima-rodada:
    name: Avancar fila de envio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chama /campanhas/executar-pendentes
        run: |
          URL="https://whodados-backend.onrender.com/api/v1/campanhas/executar-pendentes"
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" --max-time 180 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CAMPANHAS_CRON_SECRET }}" \
            "$URL") || code=000
          echo "HTTP $code"
          cat /tmp/resp.json; echo
          if [ "$code" != "200" ]; then
            echo "[ERRO] Falha ao avancar a fila de envio."
            exit 1
          fi
