name: "Teste: runner alcanca a Receita Federal?"

# Responde UMA pergunta: o runner do GitHub consegue falar com
# arquivos.receitafederal.gov.br?
#
# Os testes anteriores deram HTTP 000 e concluimos bloqueio de IP, mas
# usavam a rota /public.php/webdav/ com um mes que nao existia mais.
# Como URL errada e rede bloqueada dao sintomas diferentes (404/401 vs
# 000/timeout), esse diagnostico ficou inconclusivo.
#
# Aqui sonda a rota correta -- /public.php/dav/files/<token>/... -- e
# separa os casos:
#   200/206  -> alcanca; da pra migrar o ETL de volta pro Actions
#   000      -> sem resposta: bloqueio de IP confirmado, fica no Colab
#   401/403  -> alcanca, mas token invalido ou expirado
#   404      -> alcanca, mas o caminho mudou
#
# Roda so sob demanda e leva ~1 minuto.

on:
  workflow_dispatch:

jobs:
  sondar:
    name: "Sondar arquivos.receitafederal.gov.br"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Mesmo token publico do compartilhamento usado pelo pipeline.
      RF_TOKEN: ${{ vars.RF_SHARE_TOKEN || 'gn672Ad4CF8N6TK' }}

    steps:
      - name: "IP de saida do runner"
        run: |
          echo "IP: $(curl -s --max-time 15 https://api.ipify.org || echo '(nao obtido)')"

      - name: "1/4 - DNS e TCP"
        run: |
          echo "== DNS =="
          getent hosts arquivos.receitafederal.gov.br || echo "FALHOU: nao resolveu"
          echo "== TCP 443 =="
          timeout 15 bash -c '</dev/tcp/arquivos.receitafederal.gov.br/443' \
            && echo "OK: porta 443 aceita conexao" \
            || echo "FALHOU: nao conectou na 443 (bloqueio de rede)"

      - name: "2/4 - HTTPS na raiz"
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            https://arquivos.receitafederal.gov.br/ || echo "000")
          echo "HTTP $CODE"
          [ "$CODE" = "000" ] && echo "::warning::Sem resposta na raiz -- indicio de bloqueio" || true

      - name: "3/4 - PROPFIND (listar meses disponiveis)"
        run: |
          BASE="https://arquivos.receitafederal.gov.br/public.php/dav/files/$RF_TOKEN"
          CODE=$(curl -s -o resposta.xml -w '%{http_code}' --max-time 45 \
            -X PROPFIND -H 'Depth: 1' "$BASE/Dados/Cadastros/CNPJ/" || echo "000")
          echo "HTTP $CODE"
          if [ "$CODE" = "207" ] || [ "$CODE" = "200" ]; then
            echo "Meses encontrados:"
            grep -oE '[0-9]{4}-[0-9]{2}' resposta.xml | sort -u | tail -5
          else
            echo "Corpo da resposta (200 primeiros bytes):"
            head -c 200 resposta.xml 2>/dev/null || echo "(vazio)"
          fi

      - name: "4/4 - Baixar de verdade pelas DUAS rotas"
        id: baixar
        run: |
          HOST="https://arquivos.receitafederal.gov.br"
          DAV="$HOST/public.php/dav/files/$RF_TOKEN"
          MES=$(curl -s --max-time 45 -X PROPFIND -H 'Depth: 1' \
            "$DAV/Dados/Cadastros/CNPJ/" 2>/dev/null \
            | grep -oE '[0-9]{4}-[0-9]{2}' | sort -u | tail -1)
          MES="${MES:-2026-08}"
          echo "Mes alvo: $MES"
          CAMINHO="Dados/Cadastros/CNPJ/$MES/Cnaes.zip"

          # Rota A: dav/files, sem auth -- usada pelo pipeline_levas.py
          A=$(curl -s -o a.zip -w '%{http_code}' --max-time 120 \
            "$DAV/$CAMINHO" || echo "000")
          echo "A) dav/files (sem auth) : HTTP $A"

          # Rota B: webdav com o token como usuario -- usada pelo
          # pipeline_rf.py, que e o que o ETL #15 executa.
          B=$(curl -s -o b.zip -w '%{http_code}' --max-time 120 \
            -u "$RF_TOKEN:" "$HOST/public.php/webdav/$CAMINHO" || echo "000")
          echo "B) webdav (com auth)    : HTTP $B"

          echo "codigo=$A" >> "$GITHUB_OUTPUT"
          echo "codigo_webdav=$B" >> "$GITHUB_OUTPUT"

          # Um HTML de erro tambem chega com status 200; todo ZIP comeca
          # com os bytes "PK", entao isso separa arquivo de pagina de erro.
          for f in a.zip b.zip; do
            if [ -s "$f" ]; then
              if [ "$(head -c 2 "$f")" = "PK" ]; then
                echo "  $f: ZIP valido ($(stat -c%s "$f") bytes)"
              else
                echo "  $f: NAO e ZIP -- inicio: $(head -c 60 "$f" | tr -d '\0')"
              fi
            else
              echo "  $f: vazio"
            fi
          done

      - name: "Veredito"
        if: always()
        run: |
          A="${{ steps.baixar.outputs.codigo }}"
          B="${{ steps.baixar.outputs.codigo_webdav }}"
          {
            echo "## Runner do GitHub x Receita Federal"
            echo ""
            echo "| Rota | Usada por | HTTP |"
            echo "|---|---|---|"
            echo "| \`dav/files\` sem auth | pipeline_levas.py | ${A:-?} |"
            echo "| \`webdav\` com auth | pipeline_rf.py (ETL) | ${B:-?} |"
            echo ""
            if [ "$A" = "200" ] || [ "$B" = "200" ]; then
              echo "**ALCANCA.** O runner baixou da Receita."
              echo ""
              echo "Ou seja: o HTTP 000 de antes nao era bloqueio de IP."
              echo "Da pra trazer o ETL de volta pro Actions usando o pipeline"
              echo "em levas, que cabe nos 14 GB de disco do runner."
            elif [ "$A" = "000" ] && [ "$B" = "000" ]; then
              echo "**BLOQUEADO.** Nenhuma das duas rotas respondeu."
              echo ""
              echo "Bloqueio de IP confirmado. O ETL da Receita fica no Colab;"
              echo "so a PGFN continua no Actions."
            elif [ "$A" = "401" ] || [ "$B" = "401" ] || [ "$A" = "403" ] || [ "$B" = "403" ]; then
              echo "**ALCANCA, mas o token foi recusado.**"
              echo ""
              echo "A rede esta liberada -- o problema e o token de compartilhamento."
            elif [ "$A" = "404" ] || [ "$B" = "404" ]; then
              echo "**ALCANCA, mas o caminho nao existe.**"
              echo ""
              echo "Rede liberada; a estrutura de pastas mudou."
            else
              echo "**Inconclusivo.** Ver os passos acima."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Veredito escrito no resumo do job (A=$A B=$B)."
