# =================================================================
# Configuracao para deploy na Render.com (FastAPI backend)
# LOCAL: whodados/render.yaml
# Uso: `render api create` ou importar via webhook
# =================================================================
services:
  - type: web
    name: whodados-api
    env: python
    plan: free
    build_command: pip install -r requirements.txt
    start_command: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    directory: .
    envVars:
      - key: DATABASE_URL
        description: "Connection string do Supabase/PostgreSQL"
        exampleValue: "postgresql://user:password@host:5432/dbname"
        from: supabase_connection_string
      - key: DATA_SOURCE
        value: database
      - key: CORS_ORIGINS
        value: "https://whodados.vercel.app"
      - key: API_CACHE_TTL_SECONDS
        value: "300"

